[project]
name = "goalsift"
version = "0.2.1"
description = "Goal-driven AI solution-research application (Phase A)"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = [
    "error::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
